name: Create Release
on:
  push:
    branches:
    - main
  workflow_dispatch:

env:
  CCX_Dir: kwik-exporter
  CCX_NAME: com.kwiksher.kwik5

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

    - name: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Verify branch and list files
      run: |
        echo "Current Branch:"
        git branch --show-current
        echo "Recent Commits:"
        git log -n 5 --oneline
        echo "Listing files in Solar2D:"
        ls -la Solar2D/

    - name: Set Time
      env:
        TZ: 'Asia/Tokyo'
      run: |
          echo "CURRENT_DATETIME=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

    - name: copy install shell
      run : |
        mkdir -p UXP/kwik-exporter/kwik/base-proj
        cp install_plugin.sh UXP/kwik-exporter/kwik/base-proj
        cp install_plugin.bat UXP/kwik-exporter/kwik/base-proj
        cp -rf Solar2D UXP/kwik-exporter/kwik/base-proj
        cp -rf Photoshop UXP/kwik-exporter/kwik/base-proj



    - name: Rename for ccx
      run: |
        cd UXP
        mv ${{env.CCX_Dir}} ${{env.CCX_NAME}}

    - name: Archive Release exporter ccx
      uses: TheDoctor0/zip-release@0.7.6
      with:
        type: 'zip'
        directory: UXP
        path:  ${{env.CCX_NAME}}
        filename: ${{ env.CCX_NAME}}.exporter_PS.ccx
        exclusions: '*.git*'

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.CURRENT_DATETIME }}
        name: ${{ env.CURRENT_DATETIME }}
        draft: false
        prerelease: false
        files: |
          UXP/*.ccx

